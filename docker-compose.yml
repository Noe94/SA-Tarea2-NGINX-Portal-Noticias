services:
  app1:
    build:
      context: ./app
    container_name: techpulse-app1
    hostname: app1
    networks:
      - techpulse-network

  app2:
    build:
      context: ./app
    container_name: techpulse-app2
    hostname: app2
    networks:
      - techpulse-network

  nginx:
    image: nginx:alpine
    container_name: techpulse-nginx
    depends_on:
      - app1
      - app2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public/images:/usr/share/nginx/html/imagenes:ro
    networks:
      - techpulse-network

networks:
  techpulse-network:
    driver: bridge