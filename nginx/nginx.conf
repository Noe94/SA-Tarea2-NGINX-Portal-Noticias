upstream techpulse_backend {
    server app1:80 max_fails=1 fail_timeout=10s;
    server app2:80 max_fails=1 fail_timeout=10s;
}

upstream techpulse_instances {
    server app1:80;
    server app2:80;
}

server {
    listen 80;
    server_name _;

    location = /instancia {
        proxy_pass http://techpulse_instances;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    location /imagenes/ {
        alias /usr/share/nginx/html/imagenes/;
        try_files $uri =404;
        add_header X-TechPulse-Route "NGINX-STATIC" always;
    }

    location ^~ /noticias {
        proxy_pass http://techpulse_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        add_header X-TechPulse-Route "NOTICIAS" always;
    }

    location / {
        proxy_pass http://techpulse_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        add_header X-TechPulse-Route "PORTAL" always;
    }
}