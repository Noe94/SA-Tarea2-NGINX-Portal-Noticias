server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /instancia {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "$hostname\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}